
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Book</title>
    <link rel="stylesheet" href="recipe.css" />                
  </head>
  <body>

<body>
  <header>
    <div class="box">
    <img class="book" src="recipe-book.png" alt="a recipe book">
    <h1>Recipe Book</h1>
    </div>
    <form class="search-bar">
      <input type="text" placeholder="Find a recipe">
      <img class="search" src="search.svg" alt="magnifying glass">
    </form>

  </header>

  <main>
    <section class="media-card">
      <div class="media-card-image">
        <img src="apple-crisp.jpg" alt="apple crisp">
      </div>

      <div class="media-card-content">
        <button type="button" class="tag">Dessert</button>

        <h2>Apple Crisp</h2>

        <div class="rating">
          ⭐⭐⭐⭐☆
        </div>

        <p class="description">
          This apple crisp recipe is a simple yet delicious fall dessert
          that's great served warm with vanilla ice cream.
        </p>
      </div>
    </section>
    
  </main>

  <footer>

    <div class="social">
      <a href="#"><img src="instagram_icon.svg" alt="Instagram"></a>
      <a href="#"><img src="youtube_icon.svg" alt="YouTube"></a>
      <a href="#"><img src="pinterest_icon.svg" alt="Pinterest"></a>
    </div>



<a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>                   
  </footer>
</body>

</html>
